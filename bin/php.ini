; TG FastDownloader bundled PHP/FrankenPHP config
; Place this file next to php.exe/frankenphp.exe so the runtime loads it automatically.

extension_dir="ext"
extension=fileinfo
extension=curl
extension=mbstring
extension=openssl
extension=zip

; SSL verification is handled via curl in fd_http_get_contents() (backend.php).
; Curl has its own CA store — no openssl.cafile path needed here.
; The file_get_contents fallback uses verify_peer=false (Windows CA bundle issue).

; FrankenPHP on Windows can fail with ASLR/opcache opcode handlers.
opcache.enable=0
opcache.enable_cli=0
